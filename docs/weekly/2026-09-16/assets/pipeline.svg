<rect class="n" x="451" y="42" width="180" height="83" rx="9"/><text x="541" y="75" text-anchor="middle" font-size="16" font-weight="700">Recovery pilot</text><text x="541" y="100" text-anchor="middle" font-size="13">5 策略 × 19 = 95 条</text>
<path class="a" d="M631 84H671" marker-end="url(#arrow)"/>
<rect class="n" x="674" y="42" width="235" height="83" rx="9"/><text x="791" y="75" text-anchor="middle" font-size="16" font-weight="700">下一步：效果级评测</text><text x="791" y="100" text-anchor="middle" font-size="13">SD → 动作 → SF + ledger</text>
