<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 170" role="img" aria-label="研究流程：复现、事故筛选、恢复实验、效果级评价">
<style>text{font-family:Arial,"Microsoft YaHei",sans-serif;fill:#17324a}.n{fill:#f4f7fa;stroke:#9db2c2;stroke-width:1.5}.a{stroke:#64849b;stroke-width:2;fill:none}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5 0 10z" fill="#64849b"/></marker></defs>
<rect class="n" x="10" y="42" width="175" height="83" rx="9"/><text x="98" y="75" text-anchor="middle" font-size="16" font-weight="700">AgentDojo 复现</text><text x="98" y="100" text-anchor="middle" font-size="13">2,676 条有效攻击轨迹</text>
